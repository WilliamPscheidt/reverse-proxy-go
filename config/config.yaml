# ProxyGO - High-Concurrency Reverse Proxy & Load Balancer L4/L7 Configuration

# Operational mode: "l7" (HTTP only), "l4" (TCP only), or "both"
mode: "both"

# Web Administration Dashboard & Control Plane
admin:
  enabled: true
  listen: ":8090"
  auth_enabled: true
  username: "admin"
  password: "admin123"

# L7 HTTP Reverse Proxy Configuration
l7:
  enabled: true
  listen: ":8080"
  algorithm: "round_robin" # Supported: round_robin, least_conn, ip_hash
  backends:
    - url: "http://127.0.0.1:8081"
      weight: 1
    - url: "http://127.0.0.1:8082"
      weight: 1
    - url: "http://127.0.0.1:8083"
      weight: 1
  canary_backends:
    - url: "http://127.0.0.1:8084"
      weight: 1

# L4 TCP Load Balancer Configuration
l4:
  enabled: true
  listen: ":9000"
  algorithm: "round_robin" # Supported: round_robin, least_conn, ip_hash
  backends:
    - addr: "127.0.0.1:9081"
      weight: 1
    - addr: "127.0.0.1:9082"
      weight: 1

# Prometheus Metrics Exporter
metrics:
  enabled: true
  listen: ":2112"
  path: "/metrics"

# Active Background Health Check
health_check:
  enabled: true
  interval: 3s             # Health check frequency
  timeout: 1s              # Timeout per check
  path: "/health"          # HTTP endpoint to verify
  expected_status: 200     # HTTP status indicating health
  unhealthy_threshold: 3   # Consecutive failures before removing backend
  healthy_threshold: 2     # Consecutive successes before restoring backend

# Distributed per-IP Rate Limiting (Redis Token Bucket with In-Memory fallback)
rate_limit:
  enabled: true
  strategy: "redis"            # "redis" (distributed) or "memory" (local sharded)
  rate: 5                      # Limite: 5 requisições por segundo por IP
  burst: 10                    # Rajada máxima: 10 requisições (acima disso bloqueia com HTTP 429)
  cleanup_interval: 1m         # Frequency to purge inactive local fallback memory
  redis:
    addr: "127.0.0.1:6379"
    password: ""
    db: 0
    timeout: 150ms
    pool_size: 100

# Network and Connection Timeouts
timeouts:
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  dial_timeout: 2s
  max_idle_conns: 10000
  max_idle_conns_per_host: 2500

# Web Application Firewall (WAF) & Security
waf:
  enabled: true
  block_sqli: true            # Intercepts SQL Injection signatures
  block_xss: true             # Intercepts Cross-Site Scripting payloads
  block_path_traversal: true  # Blocks ../, /etc/passwd, and system directory traversal
  block_bad_bots: true        # Intercepts sqlmap, nikto, masscan, scanners
  blocked_countries: []       # ISO 2-letter country codes (e.g. ["RU", "CN"])
  allowed_countries: []       # Whitelist mode (e.g. ["BR", "US"])
  blocked_cidrs: []           # CIDR subnets (e.g. ["10.0.0.0/8", "192.168.100.0/24"])

# HTTP Edge Cache (In-Memory + Redis)
cache:
  enabled: true
  default_ttl: 60s            # Default cache expiration for GET/HEAD 200 OK
  max_entries: 10000          # Maximum entries in local memory

# High-Availability & Resilience (Circuit Breaker & Automatic Retries)
resilience:
  circuit_breaker:
    failure_threshold: 5      # Consecutive failures to trip circuit OPEN
    success_threshold: 2      # Consecutive successes in HALF_OPEN to CLOSE
    cooldown: 5s              # Cooldown period before trial in HALF_OPEN
  retry:
    enabled: true
    max_retries: 2            # Retries on next backend for 502/503/504
    initial_backoff: 25ms     # Exponential backoff base with jitter
    max_backoff: 150ms

# L7 Dynamic Routing, Virtual Hosts & URL Rewriting
routes:
  # Rota 1: Subdomínio Virtual Host dedicado (ex: subdominio.blabla.com -> site1)
  # Também aceita wildcard: "*.blabla.com"
  - id: "subdomain-route"
    host: "subdominio.blabla.com"
    path_prefix: "/"
    backends:
      - url: "http://127.0.0.1:8085"
        weight: 1

  # Rota 2: Reescrita de Caminho (ex: localhost/teste -> /sitenovo)
  # Requisições em /teste/abc chegam no backend como /sitenovo/abc
  - id: "path-rewrite-route"
    host: "*"
    path_prefix: "/teste"
    rewrite_prefix: "/sitenovo"
    backends:
      - url: "http://127.0.0.1:8085"
        weight: 1

  # Rota 3: Catch-all padrão com Canary Deployment (10% Canary, 90% Primary)
  - id: "default"
    host: "*"
    path_prefix: "/"
    canary_weight: 10
