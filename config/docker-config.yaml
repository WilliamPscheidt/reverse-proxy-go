mode: "both"

admin:
  enabled: true
  listen: ":8090"

l7:
  enabled: true
  listen: ":8080"
  algorithm: "round_robin"
  backends:
    - url: "http://backend-1:8081"
      weight: 1
    - url: "http://backend-2:8082"
      weight: 1
    - url: "http://backend-3:8083"
      weight: 1

l4:
  enabled: true
  listen: ":9000"
  algorithm: "round_robin"
  backends:
    - addr: "backend-1:9081"
      weight: 1
    - addr: "backend-2:9082"
      weight: 1
    - addr: "backend-3:9083"
      weight: 1

metrics:
  enabled: true
  listen: ":2112"
  path: "/metrics"

health_check:
  enabled: true
  interval: 3s
  timeout: 1s
  path: "/health"
  expected_status: 200
  unhealthy_threshold: 3
  healthy_threshold: 2

rate_limit:
  enabled: true
  rate: 150000
  burst: 200000
  cleanup_interval: 1m

timeouts:
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  dial_timeout: 2s
  max_idle_conns: 10000
  max_idle_conns_per_host: 2500
